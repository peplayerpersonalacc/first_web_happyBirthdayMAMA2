form:uppercase; letter-spacing:.18em; font-size:.72rem; font-weight:800; }h2 { font-family:Georgia, "Times New Roman", serif; font-size:clamp(2.5rem,6vw,5rem); line-height:.95; letter-spacing:-.045em; margin:10px 0 22px;}.lead { color:#57524b; max-width:760px; font-size:1.08rem; }.note { margin-top:30px; padding:22px 24px; border-left:3px solid var(--accent); background:rgba(255,255,255,.45); border-radius:0 16px 16px 0; max-width:780px;}.intro-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:end; }.fact-list { display:grid; gap:12px; }.fact { padding:17px 18px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.42);}.fact b { display:block; margin-bottom:3px; }.fact span { color:var(--muted); font-size:.93rem; }.chapters { background:var(--ink); color:#f7f2e9; }.chapters .lead { color:#bdb8af; }.chapter-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:36px; }.chapter { min-height:270px; padding:25px; border:1px solid rgba(255,255,255,.12); border-radius:22px; display:flex; flex-direction:column; justify-content:flex-end; background:linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.015));}.chapter .num { color:#a8a197; font-size:.75rem; letter-spacing:.15em; }.chapter h3 { font-family:Georgia,serif; font-size:2rem; line-height:1; margin:12px 0 8px; }.chapter p { color:#bdb8af; margin:0; }.gallery-head { display:flex; justify-content:space-between; gap:20px; align-items:end; }.gallery-head p { max-width:520px; color:var(--muted); }.gallery { margin-top:40px; display:grid; grid-template-columns:repeat(12,1fr); grid-auto-rows:92px; gap:12px;}.memory { border:0; padding:0; border-radius:18px; overflow:hidden; position:relative; cursor:pointer; background:#ddd; box-shadow:0 8px 25px rgba(0,0,0,.07); min-width:0;}.memory img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .55s ease; }.memory:hover img { transform:scale(1.045); }.memory::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.65)); opacity:.7; }.memory-caption { position:absolute; z-index:2; left:15px; right:15px; bottom:13px; color:#fff; font-size:.78rem; text-align:left; opacity:.95;}.memory.wide { grid-column:span 6; grid-row:span 4; }.memory.tall { grid-column:span 3; grid-row:span 5; }.memory.normal { grid-column:span 3; grid-row:span 4; }.video-section { background:#eee6da; }.video-wrap { margin-top:35px; border-radius:26px; overflow:hidden; background:#111; box-shadow:var(--shadow);}video { display:block; width:100%; max-height:720px; background:#111; }.video-note { display:flex; justify-content:space-between; gap:20px; padding:18px 20px; color:#625c54; font-size:.9rem; }.final { min-height:80svh; display:grid; place-items:center; text-align:center; background:radial-gradient(circle at 50% 20%, rgba(184,92,56,.18), transparent 38%), var(--paper2);}.final h2 { max-width:900px; margin-left:auto; margin-right:auto; }.final .heart { font-size:3rem; display:block; margin-bottom:10px; }.final p { max-width:650px; margin:0 auto 24px; color:var(--muted); font-size:1.05rem; }.pill { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:11px 17px; color:var(--muted); font-size:.88rem;}.music { position:fixed; right:16px; bottom:16px; z-index:20; border:1px solid rgba(0,0,0,.12); border-radius:999px; padding:10px 14px; background:rgba(255,250,242,.86); backdrop-filter:blur(12px); cursor:pointer; box-shadow:0 8px 30px rgba(0,0,0,.1);}.music-dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--accent); margin-right:7px; }.lightbox { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:18px; background:rgba(8,8,8,.92); backdrop-filter:blur(8px);}.lightbox.open { display:grid; }.lightbox img { max-width:min(94vw,1200px); max-height:84vh; object-fit:contain; border-radius:14px; }.close, .prev, .next { position:absolute; border:0; color:#fff; background:rgba(255,255,255,.12); width:46px; height:46px; border-radius:50%; cursor:pointer; font-size:1.4rem;}.close { top:18px; right:18px; }.prev { left:18px; top:50%; transform:translateY(-50%); }.next { right:18px; top:50%; transform:translateY(-50%); }.light-caption { position:absolute; left:20px; right:20px; bottom:18px; text-align:center; color:#eee; font-size:.92rem;}@media (max-width:800px) { section { padding:72px 16px; } .intro-grid { grid-template-columns:1fr; gap:28px; } .chapter-grid { grid-template-columns:1fr; } .chapter { min-height:210px; } .gallery { grid-template-columns:repeat(2,1fr); grid-auto-rows:145px; gap:9px; } .memory.wide, .memory.tall, .memory.normal { grid-column:span 1; grid-row:span 2; } .memory:nth-child(3n) { grid-row:span 3; } .memory-caption { font-size:.7rem; } .gallery-head { display:block; } .video-note { display:block; } .video-note span { display:block; margin-top:6px; }}@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } * { transition:none !important; }}</style></head><body><button class="music" id="musicBtn" type="button" aria-label="Toggle background music"><span class="music-dot"></span><span id="musicText">Music</span></button><audio id="music" loop preload="metadata" src="data:audio/mpeg;base64,<header class="hero"><div class="hero-inner"><div class="kicker">A very slightly late digital birthday card</div><h1>Happy Birthday, <span>Mama.</span> ❤️</h1><p> For Deepak Mama — the person who somehow knows the facts, the route, the hotel, the cab, the places to visit… usually before we have even reached the destination. </p><div class="hero-badge">06 August · Year intentionally unknown</div></div><div class="scroll">scroll for the memories ↓</div></header><section><div class="container intro-grid"><div><div class="eyebrow">A small note</div><h2>Some people make ordinary days more interesting.</h2><p class="lead"> We're close, and whenever we meet, there is usually something funny, some random interesting fact, or some plan that Mama has already figured out. He explores, he remembers, and he somehow makes “let's see” sound like a fully planned itinerary. </p><div class="note"><strong>Happy bday Mama, and thank you for always helping me out. ❤️</strong><br> And yes… this wish is late. I have an extremely solid excuse: collecting and arranging all these photos takes time. A lot of time. </div></div><div class="fact-list"><div class="fact"><b>The planner</b><span>Hotel? Cab? Places? Probably decided before reaching there.</span></div><div class="fact"><b>The explorer</b><span>Always ready to find somewhere new and somehow already knows something about it.</span></div><div class="fact"><b>The fact machine</b><span>Interesting facts appear with suspiciously perfect timing.</span></div><div class="fact"><b>The Mama energy</b><span>Fun when we meet. Helpful when it matters. Memorable without trying.</span></div></div></div></section><section class="chapters"><div class="container"><div class="eyebrow">Three things we know</div><h2>Same age group. Different generation.</h2><p class="lead">And honestly, that's what makes the memories better.</p><div class="chapter-grid"><article class="chapter"><div class="num">01 · FAMILY</div><h3>The people part</h3><p>The smiles, the old pictures, the ridiculous moments — the birthday wishes tell the whole story.</p></article><article class="chapter"><div class="num">02 · THE ROAD</div><h3>Two wheels, many plans</h3><p>Some of the archive belongs to the road: bikes, sunsets, quiet streets and the next place to explore.</p></article><article class="chapter"><div class="num">03 · GEN Z CHECK</div><h3>“Let me see what Gen Z is doing.”</h3><p>Mama really said: let me see what Gen Z is doing. And somehow, that became a memory worth keeping.</p></article></div></div></section><section><div class="container"><div class="gallery-head"><div><div class="eyebrow">The archive</div><h2>Every photo made the cut.</h2></div><p> No more selection rounds. These are the photos you chose — all of them. Tap any frame for a closer look. </p></div><div class="gallery"><button class="memory wide" data-index="0" aria-label="Open memory 1"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAYGBgYHBgcICAcKCwoLCg8ODAwODxYQERAREBYiFRkVFRkVIh4kHhweJB42KiYmKjY+NDI0PkxERExfWl98fKcBBgYGBgcGBwgIBwoLCgsKDw4MDA4PFhAREBEQFiIVGRUVGRUiHiQeHB4kHjYqJiYqNj40MjQ+TERETF9aX3x8p <span class="memory-caption">The people who make the memories worth keeping.</span></button><button class="memory tall" data-index="1" aria-label="Open memory 2"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAUEBBEQDhcSEhINFxcNDw0RDw4ODw8NDRINDQ0NDQ0QDQ0NDxENEA0NEQ0NEBEODQ8WFRAVEhAVFhcQGhUSGA4BBgYGCAwNCgoKChUPDw8VFRcYFRUXFRkVGRoVHRYVGhgWFRUPFRUXFx0VGR0YFh0dFRgVGRUZFRUXGBYVFhcVHf/AABEIBDgEOAMBIgACEQEDEQH/xAAdAAABBQEBAQEAAAAAAAAAAAAFAgMEBgcACAEJ/8QAXxAAAQIEAgYFBggKBwUFBwMFAgEDAAQREgUhBhMiMTJBQlFSYnEHI2FygYIUM0ORkqGisQhTY3ODssHC0vAVJJPR4eLxlKOz0/IWNFTD5BcYRFV01OMlNWTzRYSktP/EABsBAAIDAQEBAAAAAAAAAAAAAAIDAAQFAQYH/8QAQxEAAgICAQMDAwMBBgMDCwUAAAIBAxESBCEiMQUTMkFCUhRRYnIGFSMzcYKSovBhgbEkQ1NUkaGywtHS4jRjweHx/9oADAMBAAIRAxEAPwDzWJeH98DR/bBQoFj+2Nkyqx4Q8IlWQ23EgRhZY1EiP1RwjDw/6R1scBI5DDJffEo/2xHOOhbD2HDtp6I0bCp7L6s0upGbyZUNPqi2Sc1nz8YXauRbGhMHu3xII/SmaxX5OcqifVBZh/x+zFBlOM3QKC74+CRIu++njA9p/LfvWm/dEoT/AMaLCiKxMty9sKEvDP0bMR/m6qpDw/srRVgQyUMdq/5WI91N/wA1Icu8dnnAhDlnh80KL9kJEvvpVI4fu+uIQUPs37o4vu644v8AWOv8Y4TU4fT80drfv5x398J69+aclGIHsMzLVR3csuzFBx/CrgotqcJCtdxBwRoV3P612oE4xJ1zom1dX0F2obS+JFWL9xjM07cGsQaKhEDlEjmMVUc6qipbReootjuDUNaWoLyEKqq2iLvQ/tIr0nKC2VrtyZiSCqZLGmlizBRvfU1Jj8IR9BQTDWZDdeIjUv8Aqil6c+Uebn3FuUwAgs1DKkIEP5XtHAX+lWUeol1FQUIzG4vWthlcacSohlmSKdNq2AWpInMKV/fun7f+IdlsOdVoQtIREiJUISEVL1j7owb8o+kyzStILMsFgC0qNEN6iFlgn3ICv4w66YipqqMt0TqT1u/E/EJEVaBwgK5CEScRSSg6oLB9e6D16rMgLayt3fcVVmWQUzRKiudV2YJycjePV0gQA329GCz74utKKjcba1Qk4lG3bEu124FYYrxrrRBxQYqClTZET7XZgtju8tDSNBiJOrVMloomi22mPAJevBDD9DyVLzstESMUM9i73On3 ).forEach(btn => { btn.addEventListener('click', () => showMemory(Number(btn.dataset.index)));});document.getElementById('closeBtn').onclick = closeMemory;document.getElementById('prevBtn').onclick = () => showMemory(current - 1);document.getElementById('nextBtn').onclick = () => showMemory(current + 1);lightbox.addEventListener('click', e => { if (e.target === lightbox) closeMemory(); });document.addEventListener('keydown', e => { if (!lightbox.classList.contains('open')) return; if (e.key === 'Escape') closeMemory(); if (e.key === 'ArrowLeft') showMemory(current - 1); if (e.key === 'ArrowRight') showMemory(current + 1);});const music = document.getElementById('music');const musicBtn = document.getElementById('musicBtn');const musicText = document.getElementById('musicText');musicBtn.addEventListener('click', async () => { try { if (music.paused) { await music.play(); musicText.textContent = 'Music on'; } else { music.pause(); musicText.textContent = 'Music'; } } catch (err) { musicText.textContent = 'Tap again'; }});</script></body></html>
